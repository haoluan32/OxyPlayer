name: Build and Release

on:
  push:
    tags:
      - 'Oxy*'
      - 'Oxygen*'
      - 'Carbon*'
      - 'v*'

env:
  CONFIGURATION: Release
  PLATFORM: x86
  SOL_PATH: OxyPlayer.sln
  ISS_PATH: installer\oxy.iss

jobs:
  build-and-release:
    name: Build x86 Release and create installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ===== 统一版本处理步骤 =====
      - name: Update version from tag
        shell: pwsh
        id: version
        run: |
          $tag = $env:GITHUB_REF_NAME
          Write-Host "Processing tag: $tag"

          # 1. 提取前缀
          $prefixPattern = '^(Oxy|Oxygen|Carbon|v)'
          if ($tag -match $prefixPattern) {
            $prefix = $Matches[1]
            $versionPart = $tag -replace $prefixPattern, ''
          } else {
            Write-Error "Tag '$tag' does not start with Oxy/Oxygen/Carbon/v"
            exit 1
          }

          # 2. 提取简单数字版本（如 1.22）
          if ($versionPart -match '^(\d+\.\d+)') {
            $simpleVersion = $Matches[1]
          } else {
            Write-Error "Cannot extract numeric version from '$versionPart'"
            exit 1
          }

          # 3. 生成日期（yy.MM.dd 格式）
          $date = (Get-Date -Format "yy.MM.dd")
          $versionFull = "$simpleVersion.$date"

          # 4. 根据前缀决定各字段
          if ($prefix -eq "Carbon") {
            $appVersion = $versionFull
            $issVersionString = "$versionFull $prefix"
            $releaseVersionString = "$versionFull $prefix"
            $isTesting = "True"
          } else {
            $appVersion = $simpleVersion
            $issVersionString = "$simpleVersion $prefix"
            $releaseVersionString = "$simpleVersion $prefix"
            $isTesting = "False"
          }

          $releaseTitle = "v $releaseVersionString"

          Write-Host "Prefix: $prefix"
          Write-Host "SimpleVersion: $simpleVersion"
          Write-Host "Date: $date"
          Write-Host "VersionFull (internal): $versionFull"
          Write-Host "AppVersion (Version field): $appVersion"
          Write-Host "ISS MyAppVersion: $issVersionString"
          Write-Host "Release Title: $releaseTitle"
          Write-Host "IsTesting: $isTesting"

          Write-Output "prefix=$prefix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "simpleVersion=$simpleVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "versionFull=$versionFull" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "appVersion=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "issVersionString=$issVersionString" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "releaseTitle=$releaseTitle" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "isTesting=$isTesting" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          # 统一的“设置名 -> 新值”映射，三处文件共用
          $settingValues = [ordered]@{
            "VersionFull"   = $versionFull
            "Version"       = $appVersion
            "VersionPrefix" = $prefix
            "IsTesing"      = $isTesting
          }

          # ----- 5. 更新 AppInfo.settings -----
          $settingsPath = "OxyPlayer\AppInfo.settings"
          if (Test-Path $settingsPath) {
            [xml]$xml = Get-Content -Path $settingsPath -Encoding UTF8
            foreach ($name in $settingValues.Keys) {
              $node = $xml.SettingsFile.Settings.Setting | Where-Object { $_.Name -eq $name }
              if ($node) { $node.Value.InnerText = $settingValues[$name] }
              else { Write-Warning "AppInfo.settings: setting '$name' not found" }
            }
            $xml.Save($settingsPath)
            Write-Host "Updated AppInfo.settings"
          } else {
            Write-Error "AppInfo.settings not found at $settingsPath"
            exit 1
          }

          # ----- 6. 更新 AppInfo.Designer.cs 的 DefaultSettingValueAttribute -----
          # 命令行 msbuild 不会运行 SettingsSingleFileGenerator，
          # 必须手动同步 Designer.cs 里的默认值，否则 exe.config 仍是旧值。
          $designerPath = "OxyPlayer\AppInfo.Designer.cs"
          if (Test-Path $designerPath) {
            $content = [System.IO.File]::ReadAllText($designerPath)
            $changed = $false
            foreach ($name in $settingValues.Keys) {
              $value = $settingValues[$name]
              # 例：[...DefaultSettingValueAttribute("1.22.26.08.30")]
              #     public string VersionFull {
              $pattern = '(DefaultSettingValue(?:Attribute)?\(")[^"]*("\)\]\s*public\s+\w+\s+' + [regex]::Escape($name) + '\b)'
              $replacement = '${1}' + $value.Replace('$','$$') + '${2}'
              $newContent = [regex]::Replace($content, $pattern, $replacement)
              if ($newContent -ne $content) {
                $content = $newContent
                $changed = $true
                Write-Host "AppInfo.Designer.cs: '$name' -> '$value'"
              } else {
                Write-Warning "AppInfo.Designer.cs: DefaultSettingValue for '$name' not matched"
              }
            }
            if ($changed) {
              [System.IO.File]::WriteAllText($designerPath, $content, [System.Text.UTF8Encoding]::new($false))
              Write-Host "Updated AppInfo.Designer.cs"
            }
          } else {
            Write-Error "AppInfo.Designer.cs not found at $designerPath"
            exit 1
          }

          # ----- 7. 更新 app.config 的 <userSettings> -----
          # app.config 会被 MSBuild 复制成 OxyPlayer.exe.config，
          # User Scope 设置首次运行时从这里取默认值。
          $appConfigPath = "OxyPlayer\app.config"
          if (Test-Path $appConfigPath) {
            $content = [System.IO.File]::ReadAllText($appConfigPath)
            foreach ($name in $settingValues.Keys) {
              $value = $settingValues[$name]
              # 例：<setting name="VersionFull" serializeAs="String"><value>...</value></setting>
              $pattern = '(<setting\s+name="' + [regex]::Escape($name) + '"[^>]*>\s*<value>)[^<]*(</value>)'
              $replacement = '${1}' + $value.Replace('$','$$') + '${2}'
              $newContent = [regex]::Replace($content, $pattern, $replacement)
              if ($newContent -ne $content) {
                $content = $newContent
                Write-Host "app.config: '$name' -> '$value'"
              } else {
                Write-Warning "app.config: setting '$name' not matched"
              }
            }
            [System.IO.File]::WriteAllText($appConfigPath, $content, [System.Text.UTF8Encoding]::new($false))
            Write-Host "Updated app.config"
          } else {
            Write-Warning "app.config not found at $appConfigPath (exe.config will not be generated)"
          }

          # ----- 8. 更新 Inno Setup 脚本中的 MyAppVersion -----
          $issPath = $env:ISS_PATH
          if (Test-Path $issPath) {
            $content = Get-Content -Path $issPath -Raw -Encoding UTF8
            $newDefine = "#define MyAppVersion `"$issVersionString`""
            if ($content -match '(?m)^\s*#define\s+MyAppVersion\s+".*?"') {
              $content = $content -replace '(?m)^\s*#define\s+MyAppVersion\s+".*?"', $newDefine
            } else {
              $content = "$newDefine`n$content"
            }
            [System.IO.File]::WriteAllText($issPath, $content, [System.Text.UTF8Encoding]::new($false))
            Write-Host "Updated ISS MyAppVersion to $issVersionString"
          } else {
            Write-Warning "ISS file not found at $issPath"
          }

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore $env:SOL_PATH

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution (Release | x86)
        run: >
          msbuild $env:SOL_PATH
          /m
          /p:Configuration=$env:CONFIGURATION
          /p:Platform=$env:PLATFORM
          /p:RestorePackages=true
          /p:BuildProjectReferences=true

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" -ErrorAction Stop |
                  Select-Object -First 1
          & $iscc.FullName $env:ISS_PATH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate installer output
        id: installer
        shell: pwsh
        run: |
          $file = Get-ChildItem "installer\Output\*.exe" -ErrorAction Stop |
                  Select-Object -First 1
          Write-Output "path=$($file.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.version.outputs.releaseTitle }}   # 使用带 v 前缀的标题
          files: |
            ${{ steps.installer.outputs.path }}
          generate_release_notes: true